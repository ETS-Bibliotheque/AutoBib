# GitHub Actions workflow for AutoBib+
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (Python 3.12 via uv)
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read Python version
        run: |
          $version = Get-Content .python-version | Select-Object -First 1
          "PYTHON_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install $env:PYTHON_VERSION
        shell: pwsh

      - name: Install dependencies
        run: uv sync --locked --python $env:PYTHON_VERSION
        shell: pwsh

      - name: Check installed packages
        run: uv pip check --python $env:PYTHON_VERSION
        shell: pwsh

      - name: Compile sources
        run: uv run python -m compileall AutoBibPlus.py Include
        shell: pwsh

      - name: Run unit tests (if any)
        run: |
          if (Test-Path tests) {
            uv run python -m unittest discover -s tests -p "test_*.py"
          } else {
            Write-Host "No tests directory found; skipping unit tests."
          }
        shell: pwsh

  docs:
    name: Build documentation
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Read Python version
        run: echo "PYTHON_VERSION=$(sed -n '1p' .python-version)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install $PYTHON_VERSION

      - name: Install project dependencies
        run: uv sync --locked --python $PYTHON_VERSION

      - name: Install documentation dependencies
        run: uv pip install --python $PYTHON_VERSION -r docs/requirements.txt

      - name: Build Sphinx documentation
        run: uv run python -m sphinx -b html docs docs/_build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-html
          path: docs/_build/html

  deploy:
    name: Deploy GitHub Pages
    needs: docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
