# GitHub Actions workflow for AutoBib+
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            requirements-file: "requirements_Python_3_11_and_earlier.txt"
          - python-version: "3.12"
            requirements-file: "requirements_Python_3_12.txt"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements-file }}"
        shell: pwsh

      - name: Check installed packages
        run: python -m pip check
        shell: pwsh

      - name: Compile sources
        run: python -m compileall AutoBibPlus.py Include
        shell: pwsh

      - name: Run unit tests (if any)
        run: |
          if (Test-Path tests) {
            python -m unittest discover -s tests -p "test_*.py"
          } else {
            Write-Host "No tests directory found; skipping unit tests."
          }
        shell: pwsh
