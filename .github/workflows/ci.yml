# GitHub Actions workflow for AutoBib+
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            requirements-file: "requirements_Python_3_11_and_earlier.txt"
          - python-version: "3.12"
            requirements-file: "requirements_Python_3_12.txt"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements-file }}"
        shell: pwsh

      - name: Check installed packages
        run: python -m pip check
        shell: pwsh

      - name: Compile sources
        run: python -m compileall AutoBibPlus.py Include
        shell: pwsh

      - name: Run unit tests (if any)
        run: |
          if (Test-Path tests) {
            python -m unittest discover -s tests -p "test_*.py"
          } else {
            Write-Host "No tests directory found; skipping unit tests."
          }
        shell: pwsh

  docs:
    name: Build documentation
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install documentation dependencies
        run: uv pip install -r docs/requirements.txt

      - name: Build Sphinx documentation
        run: uv run sphinx-build -b html docs docs/_build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

  deploy:
    name: Deploy GitHub Pages
    needs: docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
